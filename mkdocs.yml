site_name: Serg2206 / SSVproff
site_description: Презентационная витрина проекта SSVproff — монорепозиторий для управления файлами, автоматизации, безопасности и версионирования.
site_author: Serg2206
site_url: https://serg2206.github.io/SSVproff/

repo_name: Serg2206/SSVproff
repo_url: https://github.com/Serg2206/SSVproff
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 Serg2206

theme:
  name: material
  language: ru
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
    - announce.dismiss

plugins:
  - search:
      lang:
        - ru
        - en
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Serg2206/SSVproff
      name: GitHub Repository
  analytics:
    feedback:
      title: Эта страница была полезна?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Да, полезна
          data: 1
          note: >-
            Спасибо за обратную связь!
        - icon: material/emoticon-sad-outline
          name: Можно лучше
          data: 0
          note: >- 
            Спасибо! Помогите нам улучшить страницу, создав issue в GitHub.

nav:
  - Главная: index.md
  - Архитектура: architecture.md
  - API Reference: api.md
  - Автоматизация: automation.md
  - Управление файлами: file-management.md
  - Безопасность: security.md
  - Настройка: setup.md
  - Использование: usage.md
  - Разработка: development.md
  - Changelog: changelog.md
